# Configuração do Supabase CLI para este projeto.
project_id = "aplicativo-de-nutricao"

[functions.analisar-refeicao]
# O gateway valida o login antes da função rodar; a função valida de novo.
verify_jwt = true
import_map = "./functions/analisar-refeicao/deno.json"

[functions.comentar-refeicao]
verify_jwt = true
import_map = "./functions/comentar-refeicao/deno.json"

[functions.conta]
verify_jwt = true
import_map = "./functions/conta/deno.json"
